name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The husky hooks are for local commits; skip installing them in CI.
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4

      # pnpm's version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Biome: lint, formatting and import order in one check.
      - name: Lint and format
        run: pnpm lint

      - name: Type-check
        run: pnpm check-types

      - name: Test
        run: pnpm test

  # Proves both images still build; nothing is pushed here (see release.yml).
  docker:
    name: Docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [api, ui]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

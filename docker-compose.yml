# Run the whole app:  docker compose up --build
#   ui  http://localhost:3000        api  http://localhost:8080 (docs at /reference)
#
# The api needs ANTHROPIC_API_KEY, read from .env (see .env.example).

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: experiments-api
    env_file: .env
    # Takes precedence over .env, which is meant for local development.
    environment:
      DB_PATH: /data/simulation.db
    ports:
      - "${API_PUBLISHED_PORT:-8080}:8080"
    volumes:
      - data:/data
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
    image: experiments-ui
    environment:
      # Where the ui container reaches the api: the browser goes through the
      # ui's /api proxy, so the api needs no CORS and no public address.
      API_URL: http://api:8080
    ports:
      - "${UI_PUBLISHED_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  data:

name: PR issue

# A pull request belongs to one sub-issue: branch <type>/<issue>-<slug> and
# `Closes #<issue>` in the description (scripts/project/check-pr.sh). Runs from
# the base branch and never executes the pull request's own code.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: read

jobs:
  issue-reference:
    name: Issue reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the branch and the description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: scripts/project/check-pr.sh
